# ここには書かない。別々のチャットで別の回を同時に作っても、
# 同じファイルを奪い合わないようにするため。雛形は _templates/kai.template.toml。
#
# 「作成済みの lectures / practices」の一覧もここには持たない。
# build_kai.py が articles/ を実際に見て判定する（手で保守すると必ず実体とずれる）。
