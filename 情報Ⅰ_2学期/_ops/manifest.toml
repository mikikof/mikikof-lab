# 情報Ⅰ 2学期 授業台帳（単一の正本）
#
# 回の一覧・アンカーの対応・配信先をここだけで持つ。
# 回フォルダ・index.html・進捗表はこのファイルから生成する（手で書かない）。
# TOML なのは stdlib の tomllib だけで読めるから（外部依存を足さない）。
#
#   python3 _ops/build_kai.py 1        1回ぶんを組む
#   python3 _ops/build_kai.py --all    全回を組み直す
#   python3 _ops/build_kai.py --index  ハブの index.html だけ作り直す
#   python3 _ops/check_public.py       公開安全ゲート

term = "2026年度 2学期"
subject = "情報Ⅰ"
school = "栄東"

# --- 50分の型 ---------------------------------------------------------------
# 変えるときはここを直し、_ops/kai/*.md の進行表も合わせる。
[lesson]
total_min = 50
blocks = [
  { key = "explain",  min = 25, label = "解説",           kit = "explainer" },
  { key = "practice", min = 15, label = "プリント演習",   kit = "print" },
  { key = "speed",    min = 10, label = "スピードテスト", kit = "quiz" },
]

# --- 正本の位置 -------------------------------------------------------------
# company_root は 情報Ⅰ_2学期/ から .company/ までの相対パス。
# mikikof-lab を単独で clone した環境では解決できない（build_kai.py が明示的に止まる）。
[paths]
company_root       = "../../../.."
explainer_dist     = "media/webツール/情報/edu-explainer-kit/dist"
print_dist         = "media/webツール/情報/印刷教材/dist"
print_examples     = "media/webツール/情報/印刷教材/examples"
quiz_data          = "media/webツール/情報/スピードクイズ/data/questions.js"
lectures_articles  = "../lectures/articles"    # 情報Ⅰ_2学期/ からの相対（同一リポ）
practices_articles = "../practices/articles"   # 同上

# --- 配信先（既存の公開ハブ。my-company と物理隔離した public リポ） ---------
[hubs.explainer]
public_url = "https://mikikof.github.io/joho-explainer/"
dev_repo   = "~/joho-explainer"
sync       = "~/joho-explainer/sync_from_dev.sh"

[hubs.quiz]
public_url  = "https://mikikof.github.io/joho-quiz/"
teacher_url = "https://mikikof.github.io/joho-quiz/teacher.html"
dev_repo    = "~/joho-quiz"
classes     = ["TR", "TB"]     # config.js の endpoints

[hubs.lectures]
public_url = "https://mikikof.github.io/mikikof-lab/lectures/"

[hubs.practices]
public_url = "https://mikikof.github.io/mikikof-lab/practices/"

# --- アンカー対応表 ---------------------------------------------------------
# lectures の lec 番号 = 学習ノートの POINT 番号（章番号とは無関係）。
# practices の番号 = ベストフィットの「章-節」。
# confirmed = true  は「タイトル突合からの推定。原本で確認していない」の意。
# 回を起こすとき、その回で使うアンカーだけは原本で確認して true にする。
# 2026-09-10 全行を原本で確認した（学習ノート 3〜6章 問題 Word・解答PDF、ベストフィット 3〜6章 問題・解答）。
#   2学期の範囲は POINT 14〜37。38 は学習ノートに無い（6章は 35・36・37⑴・37⑵ で終わる）。
#   授業テーマと自習教材の絞り込みは _ops/theme-plan.md。

