             "02-05", "02-06", "02-07", "02-thinking-step-2"]

# --- 回 ---------------------------------------------------------------------
# 1回 = 50分。テーマはオーナーが回ごとに指示する。
# status = planned / building / done
#
# 雛形（コメントを外して使う）:
#
# [[kai]]
# no     = 1
# slug   = "2shinsu-no-genzan"
# theme  = "2進数の減算 ― 補数でなぜ引き算が足し算になるか"
# nansho = "補数を取る操作と桁あふれを捨てる操作を別々に覚え、順序が入れ替わると答えが合わなくなる"
# nansho_type = "B"                       # A 境界 / B 順序 / C 似て非なる / D 数えると合わない
# date   = "2026-09-01"
# status = "planned"
# anchor = { kind = "lec", id = 15 }
#
#   [kai.artifacts]
#   explainer = "twos-complement.html"     # explainer_dist からの相対
#   print     = "2進数の計算"               # print_dist の <unit>（_問題/_解答 は付けない）
#   quiz      = { id = "joho-binary-calc", set_index = 4 }   # ★0起点。index.html は QUIZ_SETS[?s] を引く
#                                                            #   2026-08 時点の既存: 0 joho-digital /
#                                                            #   1 joho-image-color / 2 joho-video-compression /
#                                                            #   3 joho1-sample → 新規は 4
#   lecture   = 15                          # 未作成なら作る / 既存なら案内のみ
#   practice  = "03-09"

[[kai]]
no          = 1
slug        = "os-mokuteki-to-interface"
theme       = "装置の違いを意識せずに使えるのは誰の仕事か ― OS の目的とハードウェアインタフェース"
nansho      = "「装置の違いを意識せずに使える」を作っているのがどの層か決まらない。仕様を合わせる(ハードウェアインタフェース)と操作の内容を抽象化する(OS)が、どちらも「違いを吸収している」と読めてしまう"
nansho_type = "C"
date        = "2026-09-上旬"
status      = "building"
anchor      = { kind = "lec", id = 14 }

  [kai.artifacts]
  explainer = "os-abstraction.html"
  print     = "ハードウェアとソフトウェア"
  quiz      = { id = "joho-hardware-software", set_index = 4 }
  lecture   = 14
  practice  = "03-08"
